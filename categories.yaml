# Canonical category taxonomy for the corporate wiki. Single source of truth. Consumed by the wiki engine for the category nav; see .agent/audit/2026-07-02-category-redesign/proposal-corporate.md for the full design + BCSC posture.
wiki: media-knowledge-corporate
audience: >-
  Anyone meeting the company for the first time — from a curious member of
  the public to a banker, investor, auditor, lawyer, or accountant. Plain
  language throughout; categories are neutral, factual descriptions of the
  company and how it is organized — not securities-form section headings,
  and not invitations.
version: 2026-07-02
companion: >-
  media-knowledge-projects carries the buildings-and-places half of the
  story: the buildings, how they are designed, how sites are chosen, the
  markets, and the rollout. The two wikis together explain the whole
  company.

categories:
  - id: company
    name: "The Company"
    scope: >-
      Who Woodfine is: a British Columbia holding company that develops and
      promotes commercial buildings — a Developer and Promoter, not an
      asset manager — its history, its people, its subsidiaries, and how
      the business operates.
    audience: "Everyone — first visit"
    order: 1

  - id: investments
    name: "The Investment Vehicles"
    scope: >-
      The investment vehicles, present and planned: the parent company's
      Common Shares and the four Direct-Hold Solutions planned for
      Canada, the United States, Spain, and Mexico — what each vehicle
      is, its legal form, and the eligibility framework that applies in
      each investor's home jurisdiction.
    audience: "Investor, wealth adviser, banker"
    order: 2

  - id: financial-model
    name: "The Financial Model"
    scope: >-
      The financial engine: the Narrow Banking Model, under which
      buildings are intended to be built with zero construction debt and
      borrowing comes only after buildings are leased; the fees Woodfine
      charges and earns; and how its escrowed 10% stake is designed to
      keep it aligned with investors.
    audience: "Investor, analyst, accountant"
    order: 3

  - id: distributions
    name: "Distributions and Transfers"
    scope: >-
      The distribution policy and the unit-transfer mechanism:
      distributions are targeted to be paid from Distributable Income
      when and if declared — never guaranteed; Perpetual Equity is the
      mechanism intended to allow unitholders to offer their units for
      sale at a time of their choosing — no forced exit and no
      redemption window by design; the mechanism is not a promise of a
      buyer or a price.
    audience: "Investor, wealth adviser"
    order: 4

  - id: governance
    name: "Governance and Legal"
    scope: >-
      Who is in charge and what protects investors: the board and its
      independent directors, committees, compensation, the rules written
      into every vehicle's governing documents, and the legal record —
      contracts, proceedings, and investors' statutory rights.
    audience: "Auditor, lawyer, diligence team"
    order: 5

  - id: risks
    name: "Risks"
    scope: >-
      What could go wrong, stated plainly: market, property, financing,
      development, structural, and regulatory risks — the full list in
      one place.
    audience: "Everyone; lawyer, diligence team"
    order: 6

  - id: reports
    name: "Reports — Woodfine Capital Projects"
    scope: >-
      The parent company's paper trail: annual and quarterly financial
      statements, management's discussion, filings, press releases, and
      events — plus a plain guide to how public reporting works.
    audience: "All readers — entity-specific"
    order: 7

  - id: reports-canada
    name: "Reports — Direct-Hold Solution Canada"
    scope: >-
      Every report the Canadian partnership publishes: financial
      statements, management's discussion, filings, valuations and
      appraisals, and distribution records.
    audience: "All readers — entity-specific"
    order: 8

  - id: reports-united-states
    name: "Reports — Direct-Hold Solution United States"
    scope: >-
      Every report the United States partnership publishes: financial
      statements, management reporting, filings, valuations and
      appraisals, and distribution records.
    audience: "All readers — entity-specific"
    order: 9

  - id: reports-spain
    name: "Reports — Direct-Hold Solution Spain"
    scope: >-
      Every report the Spanish company publishes: financial statements,
      management reporting, filings, valuations and appraisals, and
      distribution records.
    audience: "All readers — entity-specific"
    order: 10

  - id: reports-mexico
    name: "Reports — Direct-Hold Solution Mexico"
    scope: >-
      Every report the Mexican trust publishes: financial statements,
      management-report equivalents, filings, valuations and appraisals,
      and distribution records.
    audience: "All readers — entity-specific"
    order: 11

  - id: research
    name: "Research"
    scope: >-
      The flagship long-form research papers — complete arguments, argued
      end to end, with full citations. A small curated set, ~3-5 papers.
    audience: "Analyst, academic, technical diligence"
    order: 12

  - id: reference
    name: "Glossary and Reader's Guide"
    scope: >-
      Every defined term in plain words, plus the forward-looking-
      statements advisory and the non-IFRS measures explained.
    audience: "All readers — consulted, not browsed"
    order: 13
