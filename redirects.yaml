# Redirects for media-knowledge-corporate
# Category redesign, 2026-07-03 (Phase C re-categorization, batch B1 — mechanical bulk
# moves). See .agent/audit/2026-07-02-category-redesign/proposal-corporate.md for the
# full design. Format: Hugo-compatible redirect list. The wiki engine emits 301 for
# each `from` path. Language variants are handled by the engine's i18n routing; only
# EN slugs are listed here.
#
# 2026-08-25 route-format fix: the engine (app-mediakit-knowledge, shared by all 3
# knowledge wikis) serves article content ONLY at /wiki/{slug} (or /es/wiki/{slug}) —
# a flat namespace, no category segment, ever (see `router()` in
# app-mediakit-knowledge/src/app.rs). Every `to:` value in this file had been written
# as the old Hugo-style /<category>/<slug> path (or a bare cross-wiki path in the same
# shape) since this file's creation — never a real route on this engine. `moved_301(to)`
# uses the `to:` value verbatim as the redirect Location, so every redirect below has
# been a silent 301 -> 404 the entire time. All entries rewritten to /wiki/<slug>
# (cross-wiki targets: scheme+host kept, path rewritten the same way); 5 redirect chains
# found and flattened to a single hop along the way (see individual entry comments).
# `from:` values are unchanged — confirmed correct: the /wiki/{*slug} wildcard route
# captures the full path including directory segments, and serve_article()'s fallback
# lookup (`state.redirects.get(&format!("/{slug}"))`) matches `from:` verbatim against
# that captured path. NOTE: a 2026-08-24 comment lower in this file asserts several
# category-prefixed `from:` values are dead per a "live curl" check — that claim was not
# re-verified here (out of this pass's scope: task instructions were explicit not to
# touch `from:` values) and appears to conflict with the route-matching logic above;
# flagged for a follow-up audit, not resolved in this commit.

