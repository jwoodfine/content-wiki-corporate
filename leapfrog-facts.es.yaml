# leapfrog-facts.es.yaml — Panel "¿Sabías que?" para corporate.woodfinegroup.com
#
# El motor lee este archivo en cada solicitud; si está ausente, suprime el panel.
# El operador rota los hechos mensualmente; los más recientes van al inicio.
# Cada hecho debe citar un slug publicado y contener una afirmación
# independientemente verificable.
# Lector: comunidad financiera institucional. Cada hecho debe llevar al
# lector de "nunca había oído hablar de estas estructuras" a "un momento,
# esto no es como funciona habitualmente el sector inmobiliario comercial
# en fondos mancomunados".
#
# Creado: 2026-05-20 por project-editorial@claude-code
# Actualizado: 2026-09-06 (cierre Track-B corporativo) — se retiraron dos hechos cuyo
# artículo de origen fue archivado o retirado en la revisión de integridad Track-B del
# 2026-08-24 (interest-coverage-ratio, fiduciary-data-mandate); ningún artículo vigente
# sostiene esas afirmaciones. Los `link_slug` ahora nombran slugs vigentes.
# Adaptación estratégica de leapfrog-facts.yaml para audiencias de
# América Latina y España.

facts:
  - text: "Un evento financiero que afecte a un activo —vacancia, litigio, refinanciación— no puede propagarse al capital del inversor en un activo diferente."
    link_slug: direct-hold-framework

  - text: "El capital a largo plazo se acumula sin la carga estructural de una reserva de caja que genera menor rendimiento que los activos subyacentes."
    link_slug: redemption-elimination

  - text: "Un inversor que busca liquidez localiza una contraparte dispuesta a través de sus propias relaciones comerciales o canales de intermediación que operan con independencia de la entidad corporativa."
    link_slug: equity-transfer-model

